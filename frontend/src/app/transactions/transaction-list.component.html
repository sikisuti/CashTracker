<h1>Transactions</h1>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    @for (transaction of transactions(); track transaction.id) {
      <tr>
        <td>{{ transaction.date }}</td>
        <td>{{ transaction.description }}</td>
        <td>{{ transaction.amount }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">No transactions yet.</td>
      </tr>
    }
  </tbody>
</table>
